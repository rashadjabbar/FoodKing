<h2 mat-dialog-title class="dialog-title">
  <i class="fas fa-key"></i>
  Şifrəni sıfırla
</h2>

<div mat-dialog-content [formGroup]="forgotForm" class="dialog-content">

  <p class="dialog-subtitle">
    Hesabınıza bağlı məlumatları daxil edin. 
    Təsdiq kodu email ünvanınıza göndəriləcək.
  </p>

  <mat-form-field appearance="outline" class="full-width custom-field">
    <mat-label>İstifadəçi adı</mat-label>
    <input matInput formControlName="username">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width custom-field">
    <mat-label>Email</mat-label>
    <input matInput formControlName="email">
  </mat-form-field>

</div>

<div mat-dialog-actions class="dialog-actions">
  <button mat-button mat-dialog-close class="btn-cancel">
    Bağla
  </button>

  <button mat-raised-button
          (click)="sendOtp()"
          [disabled]="forgotForm.invalid"
          class="btn-send">
    OTP göndər
  </button>
</div>
