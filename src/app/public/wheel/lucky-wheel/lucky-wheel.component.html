<div class="wheel-modal">
  <div class="ambient ambient-left"></div>
  <div class="ambient ambient-right"></div>

  <button type="button" class="close-button" (click)="closeDialog()" aria-label="Bağla">×</button>

  <div class="wheel-header">
    <span class="eyebrow">Şans zonası</span>
    <h2>Çarxı fırlat, hədiyyəni tut</h2>
  </div>

  <div class="wheel-body" *ngIf="isEligible; else eligibilityBlocked">
    <div class="wheel-stage">
      <div class="stage-glow"></div>

      <div class="wheel-hero">
        <div class="pointer"></div>
        <div class="wheel-ring wheel-ring-outer"></div>
        <div class="wheel-ring wheel-ring-inner"></div>

        <div class="wheel" [ngStyle]="{ 'transform': 'rotate(' + rotation + 'deg)' }">
          <div
            class="segment"
            *ngFor="let segment of segments; let i = index"
            [ngStyle]="{
              'background-color': segment.color,
              'transform': 'rotate(' + (i * (360 / segments.length)) + 'deg) skewY(-' + (90 - (360 / segments.length)) + 'deg)'
            }"
          >
            <span class="label">{{ segment.name }}</span>
          </div>
        </div>

        <div class="wheel-center-badge">
          <span>Spin</span>
        </div>
      </div>
    </div>

    <div class="wheel-actions">
      <button type="button" class="spin-button" (click)="spinWheel()" [disabled]="isSpinning || hasPlayed || isLoading || segments.length === 0">
        {{ isLoading ? 'Yüklənir...' : hasPlayed ? 'Şans istifadə olunub' : isSpinning ? 'Fırlanır...' : 'İndi fırlat' }}
      </button>

      <p class="helper-text" *ngIf="!showPrize && !feedbackMessage">
        Çarx dayandıqdan sonra nəticə aşağıda görünəcək.
      </p>

      <div *ngIf="feedbackMessage" class="feedback-banner" [ngClass]="'feedback-' + feedbackType">
        {{ feedbackMessage }}
      </div>

      <div *ngIf="showPrize" class="prize-card">
        <div class="prize-inner">
          <span class="prize-icon">🎉</span>
          <span class="prize-label">Qazandınız</span>
          <p class="prize-name">{{ prize }}</p>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="hasPlayed" class="usage-note">
    Bu hesab üçün günlük şans artıq istifadə olunub.
  </div>
</div>

<ng-template #eligibilityBlocked>
  <div class="blocked-state">
    Şans çarxı hazırda aktiv deyil. Oyun təsdiqlənəndən sonra burada yenidən açılacaq.
  </div>
</ng-template>
