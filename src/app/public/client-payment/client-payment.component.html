<div class="section-padding-120">
    <div class="container" style="overflow: auto;">
        <div *ngIf="dataSource.data.length == 0" style="width: 100%; display: flex; justify-content: center;">
            <h4>Ödəniş yoxdur</h4>
        </div>
        <div *ngIf="dataSource.data.length != 0">
            <div class="row">
                <div class="col-md-5">
                    <mat-form-field>
                        <mat-label>Tarix aralığı seçin</mat-label>
                        <mat-date-range-input [formGroup]="range" [rangePicker]="picker">
                            <input matStartDate formControlName="start" readonly placeholder="Start date"
                                (click)="picker.open()">
                            <input matEndDate formControlName="end" readonly placeholder="End date"
                                (click)="picker.open()">
                        </mat-date-range-input>
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-date-range-picker #picker>
                            <mat-datepicker-actions>
                                <button mat-raised-button matDatepickerApply (click)="selectToday()">Bu gün</button>
                                <button mat-raised-button color="primary" matDatepickerApply (click)="search()">
                                    Axtar
                                </button>
                            </mat-datepicker-actions>
                        </mat-date-range-picker>
                    </mat-form-field>
                </div>
                <div class="col-md-7">
                    <h3>Ödəniş</h3>
                </div>
            </div>




            <div class="table-div">
                <table mat-table [dataSource]="dataSource">

                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef> No. </th>
                        <td mat-cell *matCellDef="let element; let i = index;"> {{(paginator.pageIndex *
                            paginator.pageSize) + (i + 1)}} </td>
                    </ng-container>

                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef>Ad</th>
                        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                    </ng-container>

                    <ng-container matColumnDef="no">
                        <th mat-header-cell *matHeaderCellDef>№</th>
                        <td mat-cell *matCellDef="let element"> {{element.no}} </td>
                    </ng-container>

                    <ng-container matColumnDef="amount">
                        <th mat-header-cell *matHeaderCellDef>Məbləğ</th>
                        <td mat-cell *matCellDef="let element"> {{element.amount}} ₼</td>
                    </ng-container>

                    <ng-container matColumnDef="createdDate">
                        <th mat-header-cell *matHeaderCellDef>Yaranma tarixi</th>
                        <td mat-cell *matCellDef="let element"> {{element.createdDate | date: 'dd-MM-yyyy HH:mm'}} </td>
                    </ng-container>


                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns; let i = index" [attr.data-index]="i"
                        [ngClass]="{'selected-row': isActive(i)}" (click)=" highlight(i, row.id);">
                    </tr>
                </table>
                <mat-paginator [length]="length" #paginator [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
                    (page)="onChangePage($event)" showFirstLastButtons>
                </mat-paginator>

            </div>
        </div>
        <ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="medium" color="#fff" type="ball-scale-pulse"
            [fullScreen]="true">
            <p style="color: white"> Yüklənir... </p>
        </ngx-spinner>



    </div>
</div>
